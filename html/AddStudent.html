<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Management | Add Student</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/app.js" defer></script>
  </head>
  <body class="form-page">
    <header class="site-header">
      <div class="brand">School Management</div>
      <a class="back" href="../index.html">Back to dashboard</a>
    </header>
    <main class="content">
      <p class="kicker">Admin workspace</p>
      <h1>Add a student</h1>
      <p class="intro">
        Create the student record first. The student can then register using the
        generated UID.
      </p>
      <form id="studentForm">
        <div class="grid">
          <div>
            <label for="name">Student name</label
            ><input id="name" required placeholder="Enter student name" />
          </div>
          <div>
            <label for="uid">UID (automatic)</label
            ><input
              id="uid"
              class="readonly"
              readonly
              placeholder="Generated after saving"
            />
          </div>
          <div>
            <label for="birthdate">Date of birth</label
            ><input id="birthdate" type="date" required />
          </div>
          <div>
            <label for="age">Age (automatic)</label
            ><input
              id="age"
              class="readonly"
              readonly
              placeholder="Calculated from birth date"
            />
          </div>
          <div>
            <label for="gender">Gender</label
            ><select id="gender" required>
              <option value="">Choose gender</option>
              <option>Rather not to say</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>
          <div>
            <label for="grade">Grade level</label
            ><select id="grade" required>
              <option value="">Choose grade</option>
              <option>G7</option>
              <option>G8</option>
              <option>G9</option>
              <option>G10</option>
              <option>G11</option>
              <option>G12</option>
            </select>
          </div>
          <div id="strandField" class="hidden">
            <label for="strand">Strand</label
            ><select id="strand">
              <option value="">Choose strand</option>
              <option>STEM</option>
              <option>ABM</option>
              <option>HUMSS</option>
              <option>GAS</option>
              <option>TVL</option>
              <option>ICT</option>
            </select>
          </div>
          <div>
            <label for="section">Section (automatic)</label
            ><input
              id="section"
              class="readonly"
              readonly
              placeholder="Generated after saving"
            />
          </div>
          <div>
            <label for="phone">Phone number</label
            ><input
              id="phone"
              type="tel"
              required
              placeholder="Enter phone number"
            />
          </div>
          <div>
            <label for="email">Gmail</label
            ><input
              id="email"
              type="email"
              required
              placeholder="Enter Gmail address"
            />
          </div>
          <div>
            <label for="picture">Student picture</label>
            <input id="picture" type="file" accept="image/*" />
          </div>
        </div>
        <p class="message" id="message" role="alert"></p>
        <div class="actions">
          <button class="primary" type="submit">Add Student</button
          ><a class="button secondary" href="../index.html">Go Back</a>
        </div>
      </form>
    </main>
  </body>
</html>
