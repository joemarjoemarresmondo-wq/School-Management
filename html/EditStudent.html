<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Management | Edit Student</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/app.js" defer></script>
  </head>
  <body class="form-page">
    <header class="site-header">
      <div class="brand">School Management</div>
      <div class="user">
        <span id="userName"></span>
        <button class="logout" id="logout">Log out</button>
      </div>
    </header>
    <div class="layout">
      <nav>
        <p>Navigator</p>
        <a href="../index.html">View Student</a>
        <a href="AddStudent.html">Add Student</a>
        <a href="Quiz.html">Quiz Game</a>
        <a href="StudentGrades.html">Student Grades</a>
        <p>Settings</p>
      </nav>
      <main class="content">
        <p class="kicker">Admin workspace</p>
        <h1>Edit student</h1>
        <p class="intro">
          Only the student name and enrollment status can be changed.
        </p>
        <form id="editStudentForm">
          <div class="grid">
            <div>
              <label for="name">Student name</label><input id="name" required />
            </div>
            <div>
              <label for="status">Enrollment status</label
              ><select id="status" required>
                <option>Active</option>
                <option>Inactive</option>
                <option>Graduated</option>
                <option>Not currently studying</option>
              </select>
            </div>
            <div>
              <label for="uid">UID</label
              ><input id="uid" class="readonly" readonly />
            </div>
            <div>
              <label for="grade">Grade level</label
              ><input id="grade" class="readonly" readonly />
            </div>
            <div>
              <label for="section">Section</label
              ><input id="section" class="readonly" readonly />
            </div>
            <div>
              <label for="strand">Strand</label
              ><input id="strand" class="readonly" readonly />
            </div>
          </div>
          <p class="message" id="message" role="alert"></p>
          <div class="actions">
            <button class="primary" type="submit">Save changes</button
            ><a class="button secondary" href="../index.html">Cancel</a>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
