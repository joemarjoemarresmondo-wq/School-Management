<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Management | Admin Settings</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/app.js" defer></script>
  </head>
  <body class="form-page">
    <header class="site-header">
      <div class="brand">School Management</div>
      <div class="user">
        <span id="userName"></span>
        <button class="logout" id="logout">Log out</button>
      </div>
    </header>
    <div class="layout">
      <nav>
        <p>Navigator</p>
        <a href="../index.html">View Student</a>
        <a href="AddStudent.html">Add Student</a>
        <a href="Quiz.html">Quiz Game</a>
        <a href="StudentGrades.html">Student Grades</a>
        <p>Settings</p>
        <a href="AdminSettings.html">Admin settings</a>
      </nav>
      <main class="content">
        <p class="kicker">Admin workspace</p>
        <h1>Admin settings</h1>
        <p class="intro">Manage the admin profile picture and appearance.</p>
        <form id="adminSettingsForm">
          <div class="profile-editor">
            <img
              class="profile-picture-preview"
              id="currentPicture"
              src="../Images/1.jpg"
              alt="Admin profile picture"
            />
            <button
              class="profile-edit-button"
              id="editProfileButton"
              type="button"
            >
              Edit profile
            </button>
          </div>
          <div class="hidden" id="adminProfileFields">
            <label for="adminName">Name</label>
            <input id="adminName" required />
            <label for="adminTitle">Position</label>
            <input id="adminTitle" required />
            <label for="picture">Profile picture</label>
            <input id="picture" type="file" accept="image/*" />
          </div>
          <p class="message" id="message" role="alert"></p>
        </form>
        <section class="settings-option">
          <div>
            <strong>Appearance</strong>
            <p>Switch between light and dark mode.</p>
          </div>
          <button class="theme-button" id="themeToggle" type="button">
            Dark mode
          </button>
        </section>
        <section class="settings-option">
          <div>
            <strong>Change language</strong>
            <p>Choose your preferred language.</p>
          </div>
          <select
            class="language-select"
            id="languageSelect"
            aria-label="Change language"
          >
            <option value="en">English</option>
            <option value="tl">Tagalog</option>
          </select>
        </section>
        <div class="actions settings-actions hidden" id="adminSaveActions">
          <button class="primary" type="submit" form="adminSettingsForm">
            Save changes
          </button>
        </div>
      </main>
    </div>
  </body>
</html>
