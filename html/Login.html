<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Management | Login</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/app.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-intro">
        <p class="eyebrow brand">School Management</p>
        <h1>Welcome back.</h1>
        <p>
          Sign in to view the school dashboard and keep student records in one
          place.
        </p>
      </section>
      <section class="auth-panel">
        <h2>Log in</h2>
        <p class="sub">Use your registered name or UID.</p>
        <form id="loginForm">
          <label for="identity">Name / UID</label
          ><input
            id="identity"
            required
            autocomplete="username"
            placeholder="Enter name or UID"
          />
          <label for="password">Password</label>
          <div class="password">
            <input
              id="password"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Enter password"
            /><button type="button" id="togglePassword">Show</button>
          </div>
          <p class="message" id="message" role="alert"></p>
          <div class="actions">
            <button class="primary" type="submit">Login</button
            ><a class="button secondary" href="Register.html">Register</a>
          </div>
        </form>
        <div class="links">
          <span>Need help signing in?</span
          ><a href="ForgotPassword.html">Forgot password</a>
        </div>
      </section>
    </main>
  </body>
</html>
