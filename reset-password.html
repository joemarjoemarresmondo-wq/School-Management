<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123c35" />
    <title>Reset password | SchoolManagement</title>
    <link rel="stylesheet" href="verify.css?v=mobile-layout-1" />
  </head>
  <body>
    <main class="verification">
      <p class="eyebrow">SchoolManagement School Portal</p>
      <h1>Choose a new password</h1>
      <form id="reset-password-form">
        <div class="field">
          <label for="new-password">New password</label>
          <input
            id="new-password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="At least 8 characters"
            required
          />
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input
            id="confirm-password"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="Enter your new password again"
            required
          />
        </div>
        <button class="reset-button" type="submit">Update password</button>
        <p id="reset-status" role="status" aria-live="polite" hidden></p>
      </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js" defer></script>
    <script src="reset-password.js" defer></script>
  </body>
</html>
