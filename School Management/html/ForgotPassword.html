<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Management | Forgot Password</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/app.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-intro">
        <p class="eyebrow">School Management</p>
        <h1>Account recovery.</h1>
        <p>Answer the security question you created during registration.</p>
      </section>
      <section class="auth-panel">
        <h2>Forgot password</h2>
        <p class="sub">
          Verify your student record to reveal your saved login details.
        </p>
        <form id="recoveryForm">
          <label for="identity">Name / UID</label
          ><input
            id="identity"
            required
            placeholder="Enter name or UID"
          /><label for="answer"
            >Security question: What is your grade level and section?</label
          ><input id="answer" required placeholder="Example: G10 - Rose" />
          <p class="message" id="message" role="alert"></p>
          <button class="primary" type="submit">Submit</button>
        </form>
        <div class="result" id="result"></div>
        <a class="button secondary" href="Login.html">Go Back</a>
      </section>
    </main>
  </body>
</html>
